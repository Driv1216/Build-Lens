[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buildlens"
version = "0.1.0"
description = "BuildLens Phase 2 Stage 12 framework laboratory"
readme = {text = "BuildLens Phase 2 Stage 12 framework laboratory.", content-type = "text/markdown"}
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.2,<7",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "pathspec>=1.1,<2",
  "pgvector==0.4.1",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "types-PyYAML>=6,<7",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]
embeddings = [
  "huggingface-hub==0.34.4",
  "psutil==7.0.0",
  "sentence-transformers==5.1.1",
  "torch==2.8.0",
  "transformers==4.56.2",
]
reranking = [
  "huggingface-hub==0.34.4",
  "psutil==7.0.0",
  "torch==2.8.0",
  "transformers==4.56.2",
]
generation = [
  "google-genai==2.25.0",
  "openai==2.37.0",
]
lab-langchain = [
  "langchain==1.4.7",
  "langchain-core==1.7.0",
  "langchain-text-splitters==1.1.3",
  "langchain-classic==1.0.8",
  "langchain-community==0.4.2",
  "bm25s==0.3.15",
  "psutil==7.0.0",
]
lab-llamaindex = [
  "llama-index-core==0.14.25",
  "llama-index-retrievers-bm25==0.8.0",
  "psutil==7.0.0",
]
lab-providers = [
  "langchain-google-genai==4.4.2",
  "llama-index-llms-google-genai==0.11.3",
]
lab-pgvector = [
  "llama-index-vector-stores-postgres==0.9.0",
]
lab-code = [
  "tree-sitter-language-pack==1.22.1",
]

[project.scripts]
buildlens = "buildlens.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/buildlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not real_model and not real_provider'"
markers = [
  "integration: requires a running PostgreSQL database and applies real migrations",
  "real_model: requires the explicitly downloaded pinned embedding model",
  "real_provider: explicitly enabled paid Gemini and disposable PostgreSQL verification",
  "lab: Stage 12 tests that spawn LangChain/LlamaIndex worker processes (lab extras required)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI dependency injection intentionally uses Depends defaults.

[tool.ruff.lint.per-file-ignores]
# Generated synthetic-fixture literals are kept verbatim for readability of the corpus.
"src/buildlens/infrastructure/lab/synthetic.py" = ["E501"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
check_untyped_defs = true
follow_imports = "skip"
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["huggingface_hub.*", "psutil.*", "sentence_transformers.*", "torch.*", "transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pgvector", "pgvector.*", "numpy", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["openai", "openai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bm25s", "bm25s.*", "psutil", "psutil.*"]
ignore_missing_imports = true
